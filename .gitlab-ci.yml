stages:
  - build
  - test
  - lint
  - deploy

variables:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "24.10"

# Backend Jobs
.backend_template: &backend_template
  before_script:
    - cd backend
    - pip install --upgrade pip
    - pip install -r requirements.txt
  image: python:${PYTHON_VERSION}-slim
  only:
    changes:
      - backend/**/*

backend:build:
  <<: *backend_template
  stage: build
  script:
    - echo "Building backend..."
    - python -m py_compile ./**/*.py || true
    - echo "Backend build completed"

backend:test:
  <<: *backend_template
  coverage: '/TOTAL.*\s+(\d+%)$/'
  stage: test
  script:
    - echo "Running backend tests..."
    - pytest -v --tb=short

backend:lint:
  <<: *backend_template
  stage: lint
  script:
    - echo "Linting backend..."
    - pip install black
    - python -m black .

backend:deploy:
  before_script:
    - cd frontend
    - npm install -g vercel@latest
  environment:
    name: production
    url: https://kenzyqa-api.vercel.app
  image: node:${NODE_VERSION}
  only:
    changes:
      - backend/**/*
  stage: deploy
  script:
    - echo "Deploying backend to Vercel..."
    - |
      if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ]; then
        export VERCEL_PROJECT_ID=prj_AtuLdmdvI4o00My6H01auw3wClAN
        vercel --token $VERCEL_TOKEN --scope $VERCEL_ORG_ID --prod --yes || echo "Deployment failed or not configured"
      else
        echo "Vercel credentials not configured. Set VERCEL_TOKEN and VERCEL_ORG_ID CI/CD variables."
        exit 1
      fi

# Frontend Jobs
.frontend_template: &frontend_template
  before_script:
    - cd frontend
    - npm ci
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - frontend/node_modules/
  image: node:${NODE_VERSION}
  only:
    changes:
      - frontend/**/*

frontend:build:
  <<: *frontend_template
  stage: build
  script:
    - echo "Building frontend..."
    - npm run build

frontend:test:
  <<: *frontend_template
  stage: test
  dependencies:
    - frontend:build
  script:
    - echo "Running frontend tests..."
    - |
      if grep -q '"test"' package.json; then
        npm test -- --passWithNoTests || echo "Tests completed with warnings"
      else
        echo "No test script configured in package.json, skipping tests"
      fi

frontend:lint:
  <<: *frontend_template
  stage: lint
  script:
    - echo "Linting frontend..."
    - npm run format
    - npm run lint

frontend:deploy:
  before_script:
    - cd frontend
    - npm install -g vercel@latest
  image: node:${NODE_VERSION}
  environment:
    name: production
    url: https://kenzyqa.vercel.app
  only:
    changes:
      - frontend/**/*
  stage: deploy
  script:
    - echo "Deploying frontend to Vercel..."
    - |
      if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ]; then
        export VERCEL_PROJECT_ID=prj_P3LExRDOk5MSOKaQHc1y9oafHgDA
        vercel --token $VERCEL_TOKEN --scope $VERCEL_ORG_ID --prod --yes
      else
        echo "Vercel credentials not configured. Set VERCEL_TOKEN and VERCEL_ORG_ID CI/CD variables."
        exit 1
      fi
