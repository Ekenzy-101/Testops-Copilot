<svg viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle for icon -->
  <circle cx="60" cy="60" r="45" fill="#10b981" opacity="0.1"/>
  
  <!-- Main icon - stylized K with checkmark integration -->
  <g transform="translate(60, 60)">
    <!-- Left vertical line of K -->
    <path d="M -20 -25 L -20 25" stroke="#10b981" stroke-width="6" stroke-linecap="round" fill="none"/>
    
    <!-- Upper diagonal of K morphing into checkmark -->
    <path d="M -20 -5 L -5 -20 L 5 -10 L 20 -25" stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Lower diagonal of K -->
    <path d="M -20 5 L 20 25" stroke="#10b981" stroke-width="6" stroke-linecap="round" fill="none"/>
    
    <!-- Checkmark accent (subtle) -->
    <path d="M 0 -8 L 8 0 L 22 -18" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6"/>
  </g>
  
  <!-- Text: Kenzy -->
  <text x="120" y="65" font-family="'Inter', 'SF Pro Display', -apple-system, system-ui, sans-serif" font-size="42" font-weight="700" fill="#1f2937" letter-spacing="-1">
    Kenzy
  </text>
  
  <!-- Text: QA -->
  <text x="245" y="65" font-family="'Inter', 'SF Pro Display', -apple-system, system-ui, sans-serif" font-size="42" font-weight="700" fill="#10b981" letter-spacing="-1">
    QA
  </text>
  
  <!-- Subtitle: .io -->
  <text x="320" y="65" font-family="'Inter', 'SF Pro Display', -apple-system, system-ui, sans-serif" font-size="28" font-weight="500" fill="#6b7280" letter-spacing="-0.5">
    .io
  </text>
  
  <!-- Tagline -->
  <text x="120" y="88" font-family="'Inter', 'SF Pro Display', -apple-system, system-ui, sans-serif" font-size="13" font-weight="500" fill="#9ca3af" letter-spacing="1.5">
    AI-POWERED TEST AUTOMATION
  </text>
</svg>