name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check Paths Changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          base: ${{ github.event.before }}
          ref: ${{ github.sha }}
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  backend:
    name: Deploy Backend
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.backend == 'true'}}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.7"

      - name: Install Dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint Code
        run: |
          cd backend
          pip install black
          python -m black .

      - name: Build Code
        run: |
          cd backend
          python -m py_compile ./**/*.py || true

      - name: Test Code
        run: |
          cd backend
          pytest --alluredir=allure-results --cov=. --cov-fail-under=60

      - name: Deploy Code
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          cd backend
          bash <(curl -fsSL cli.new)
          railway link -p kenzyqa -s service api
          railway up -d

  frontend:
    name: Deploy Frontend
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.frontend == 'true'}}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.10.0"

      - name: Install Dependencies
        run: |
          cd frontend
          npm install -g npm@latest
          npm install

      - name: Lint Code
        run: |
          cd frontend
          npm run lint

      - name: Build Code
        run: |
          cd frontend
          npm run build

      - name: Test Code
        run: |
          cd frontend
          npm run test

      - name: Deploy Code
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          cd frontend
          bash <(curl -fsSL cli.new)
          railway link -p kenzyqa -s service web
          railway up -d
